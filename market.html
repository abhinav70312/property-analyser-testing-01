<div class="wrap"><h2>Buy & Sell</h2><p class="mut">All dealer properties in one place. Filter by dealer, or list your own.</p>
<div class="card" id="spot-search" style="display:flex;gap:8px"><input id="q" placeholder="Search plots, houses, SCO…" style="flex:2"><select id="dFilter" onchange="renderListings()" style="flex:1"><option>All dealers</option></select></div><br><div id="lists" class="grid g3"></div><br>
<div class="grid g2"><div class="card" id="spot-sell"><h3>Sell your property (free)</h3>
<input id="lT" placeholder="Title e.g. 200 sq.yd plot Sec 34"><select id="lS"></select>
<input id="lA" type="number" placeholder="Area sq.ft"><input id="lP" type="number" placeholder="Price Rs">
<select id="lTy"><option>Plot</option><option>House</option><option>Flat</option><option>Commercial</option></select>
<input id="lBy" placeholder="Your / firm name"><input id="lPh" placeholder="Phone"><button onclick="addListing()">Publish</button></div>
<div class="card" id="spot-demand"><h3>Buyer? Post need here too</h3><p class="mut">Also on the Dealers board.</p><div id="dems"></div><br>
<input id="dN" placeholder="Name"><input id="dP" placeholder="Phone"><input id="dB" placeholder="Budget e.g. Rs 80L"><input id="dL" placeholder="Location">
<select id="dT"><option>Plot</option><option>House</option><option>Flat</option><option>Commercial</option></select>
<input id="dNote" placeholder="Note"><button onclick="addDemand()">Post requirement</button></div></div></div>
<script src="data.js"></script><script src="app.js"></script><script src="widget.js"></script><script src="botbrain.js"></script><script src="fx.js"></script></body></html>
